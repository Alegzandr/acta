[package]
name = "syntax-dump"
version = "0.1.0"
edition = "2024"
publish = false
description = "Precompiles a Sublime syntax into the syntect dump Acta embeds (markdown_view/highlight.rs)."

# Not part of the workspace: the YAML loader it needs never ships in Acta.
[workspace]

[dependencies]
# The syntect Acta uses: a dump only loads into the version that wrote it.
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "regex-fancy", "yaml-load"] }
