name: Bug report
description: Something in Acta does not work as described.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install with install.ps1
        2. Start Acta
        3. ...
  - type: input
    id: version
    attributes:
      label: Acta version
      placeholder: "0.1.3"
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Windows
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true
  - type: input
    id: system-version
    attributes:
      label: System version
      placeholder: "Windows 11 24H2, macOS 26.1, Ubuntu 24.04 (Wayland)"
  - type: textarea
    id: log
    attributes:
      label: Log
      description: >
        Optional. The relevant lines of acta.log (see CONTRIBUTING.md for where it is).
        It holds no user content, but read it before you paste it.
      render: text
