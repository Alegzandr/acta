name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  # Keyed on the pull request number: `head_ref` is chosen by the author of a fork and
  # two forks can use the same branch name.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Debug info is the bulk of a dev build's size and link time; CI never debugs.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  lint:
    name: fmt and script lints
    # A pull request from a branch of this repository is already covered by its push run.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: scripts/ci/setup-rust.sh
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: shellcheck
        run: shellcheck install.sh scripts/package.sh scripts/licenses.sh scripts/model-pins.sh scripts/vad.sh scripts/ci/*.sh spikes/storage/platform-checks.sh
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          # Write-Host is intended in install.ps1: it talks to the person running it.
          # -Path takes a single string, so each file is analyzed on its own.
          # ParseError is a severity of its own: without it a script that does not even
          # parse is only reported on the error stream and the loop collects nothing.
          $issues = foreach ($file in 'install.ps1', 'scripts/package.ps1', 'scripts/ci/update-e2e.ps1', 'scripts/ci/windows-perl.ps1', 'scripts/ci/windows-libclang.ps1', 'scripts/ci/windows-sde-start.ps1', 'scripts/ci/vulkan-sdk.ps1', 'scripts/ci/check-prereqs.ps1') {
            Invoke-ScriptAnalyzer -Path $file -Severity ParseError, Error, Warning -ExcludeRule PSAvoidUsingWriteHost
          }
          $issues | Format-Table -AutoSize ScriptName, Line, RuleName, Message
          if ($issues) { exit 1 }

  # RustSec advisories (vulnerable, yanked or unmaintained crates) and crate sources,
  # against Cargo.lock and deny.toml. Needs no build, so it runs beside lint. A new
  # advisory can turn it red without a change here: update the crate, or add an ignore
  # with its reason in deny.toml. release.yml does not run it.
  deny:
    name: cargo deny
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: scripts/ci/setup-rust.sh
      - name: Install cargo-deny
        run: scripts/ci/install-cargo-deny.sh
      - name: cargo deny check
        run: cargo deny --locked check advisories sources

  test:
    name: clippy, test, build (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: scripts/ci/linux-deps.sh --headless
      - name: Rust toolchain
        run: scripts/ci/setup-rust.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache: branch caches cannot be read by other branches
          # and would push main's entries out of the 10 GB quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Native Perl for OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/ci/windows-perl.ps1
      - name: libclang for whisper.cpp's bindings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/ci/windows-libclang.ps1
      # whisper.cpp's Vulkan backend (ADR 0014, amendment "Vulkan in Acta.exe") is
      # compiled with LunarG's SDK headers and glslc, pinned and hash-checked by the
      # scripts; the trimmed SDK is cached by the scripts' hash.
      - name: Vulkan SDK cache (Windows, Linux)
        if: runner.os != 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vulkan-sdk
          key: vulkan-sdk-${{ runner.os }}-${{ hashFiles('scripts/ci/vulkan-sdk.*') }}
      - name: Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/ci/vulkan-sdk.ps1 -Dir (Join-Path $env:RUNNER_TEMP 'vulkan-sdk')
      - name: Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        run: scripts/ci/vulkan-sdk.sh "$RUNNER_TEMP/vulkan-sdk"
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked
      # Links the real executables. The dependencies are already compiled by the test
      # step, so this costs seconds. The optimized build of every channel runs in
      # release.yml, which also runs as a dry run on main.
      - name: cargo build
        run: cargo build --workspace --locked
      # whisper.cpp is compiled in with AVX2 (ADR 0014, amendment); Acta itself must
      # still start on an older processor. Intel SDE emulates one without AVX2. By
      # using SDE the workflow accepts Intel's SDE licence (CI only, nothing shipped).
      - name: Intel SDE (Windows)
        if: runner.os == 'Windows'
        uses: petarpetrovt/setup-sde@6d2773bc0ef3005fd52e0ae0bb91782321793aec # v6.0
        with:
          sdeVersion: 10.13.1
      - name: Acta starts without AVX2 (Windows, emulated)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/ci/windows-sde-start.ps1 -Exe target/debug/Acta.exe
      # Fails when a dependency has a licence about.toml does not accept or a font has
      # no licence file, long before a release would.
      - name: Third-party notices (Linux)
        if: runner.os == 'Linux'
        run: |
          scripts/ci/install-cargo-about.sh
          scripts/licenses.sh
      # No GPU on the runner: Xvfb as the display and Mesa lavapipe as the Vulkan driver.
      # The window has to stay up for 10 seconds (timeout exits with 124).
      # Not blocking until it has proven reliable on real runs.
      - name: Smoke run of the GUI under Xvfb (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          status=0
          xvfb-run -a timeout 10 ./target/debug/Acta || status=$?
          echo "exit status: $status"
          if [ "$status" -ne 124 ]; then
            echo "::warning::Acta did not stay up for 10 seconds under Xvfb (exit status $status)"
            exit 1
          fi
