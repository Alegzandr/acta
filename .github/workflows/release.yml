name: Release

# A `v*` tag builds every channel and publishes the GitHub release.
# A push to main or a manual run is a dry run: same build and packaging, artifacts
# only, no release. See docs/releasing.md.
on:
  push:
    tags: ['v*']
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'spikes/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a tag build half-way through publishing.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  # Must equal the `velopack` crate version in Cargo.lock; the check job enforces it.
  VPK_VERSION: 1.2.161
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  check:
    name: version check and notices
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the next step needs origin/main and the path down to the tag.
          fetch-depth: 0
      # Before anything from the commit is executed. A release is only ever cut from a
      # commit that is on main, where CI and the dry run have already built it; a tag
      # put on a side branch stops here.
      - name: The tagged commit is on main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::error::origin/main was not fetched; cannot check where the tag is"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of origin/main; tag a commit of main"
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on main"
      - name: Rust toolchain
        run: scripts/ci/setup-rust.sh
      - name: Workspace version, tag and vpk pin
        id: version
        env:
          IS_TAG_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 |
            jq -r '.packages[] | select(.name == "acta-app") | .version')
          if [ -z "$version" ] || [ "$version" = null ]; then
            echo "::error::could not read the acta-app version from cargo metadata"
            exit 1
          fi

          locked=$(awk '/^name = "velopack"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          if [ "$locked" != "$VPK_VERSION" ]; then
            echo "::error::Cargo.lock has velopack '$locked' but the workflow installs vpk $VPK_VERSION; they must match"
            exit 1
          fi

          if [ "$IS_TAG_PUSH" = true ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version (expected v$version)"
              exit 1
            fi
            echo "Releasing Acta $version"
          else
            echo "Dry run of Acta $version: packages are built, nothing is published"
          fi

          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          {
            echo "version=$version"
            echo "publish=$IS_TAG_PUSH"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      # Once for all channels: the notices cover the crates of every target. Fails when
      # a dependency has a licence about.toml does not accept.
      - name: Third-party notices
        run: |
          scripts/ci/install-cargo-about.sh
          scripts/licenses.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licenses
          path: dist/licenses/
          if-no-files-found: error
          retention-days: 14

  build:
    name: build ${{ matrix.channel }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: win-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - channel: osx-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          # Cross-compiled on the Apple silicon runner. If that ever fails, the free
          # Intel runner is `macos-26-intel`.
          - channel: osx-x64
            os: macos-latest
            target: x86_64-apple-darwin
          # Oldest available Ubuntu, for the oldest glibc baseline (2.35).
          - channel: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check.outputs.version }}
      CHANNEL: ${{ matrix.channel }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: scripts/ci/linux-deps.sh --package --headless
      - name: Rust toolchain
        run: scripts/ci/setup-rust.sh "$TARGET"
      # Dry runs only. What a tag build ships is compiled from scratch: nothing restored
      # from a cache, which any earlier run on main could have written, ends up in a
      # release. Only main saves the cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.check.outputs.publish != 'true'
        with:
          key: ${{ matrix.channel }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Native Perl for OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/ci/windows-perl.ps1
      - name: libclang for whisper.cpp's bindings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/ci/windows-libclang.ps1
      # The Silero VAD every package ships (ADR 0014, 4), before the build: build.rs
      # checks it against its pin, and the packaging scripts copy it beside the app.
      # Small (885 KB) and pinned by SHA-256, so it is fetched on every build, never cached.
      - name: Silero VAD
        run: scripts/vad.sh --fetch
      # whisper.cpp's Vulkan backend (ADR 0014, amendment "Vulkan in Acta.exe"): LunarG's
      # SDK headers and glslc, pinned and hash-checked by the scripts. A tag build
      # downloads and checks it afresh; dry runs use the cache.
      - name: Vulkan SDK cache (Windows, Linux)
        if: runner.os != 'macOS' && needs.check.outputs.publish != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vulkan-sdk
          key: vulkan-sdk-${{ runner.os }}-${{ hashFiles('scripts/ci/vulkan-sdk.*') }}
      - name: Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/ci/vulkan-sdk.ps1 -Dir (Join-Path $env:RUNNER_TEMP 'vulkan-sdk')
      - name: Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        run: scripts/ci/vulkan-sdk.sh "$RUNNER_TEMP/vulkan-sdk"
      # whisper.cpp is built with CMake (ADR 0014). For the Intel build on the Apple
      # silicon runner, CMake must target x86_64: whisper-rs-sys hands CMAKE_*
      # variables to CMake, and ggml then picks its x86 code paths. The cmake crate
      # would pass the same value; stating it keeps the cross build explicit.
      - name: cargo build --release
        run: |
          if [ "$TARGET" = x86_64-apple-darwin ]; then
            export CMAKE_OSX_ARCHITECTURES=x86_64
          fi
          # ggml-vulkan's nested CMake build overruns Windows' 260-character
          # paths under the workspace: build in a short directory and link it
          # back as ./target so packaging finds target/<triple>/release.
          if [ "$RUNNER_OS" = Windows ]; then
            export CARGO_TARGET_DIR=C:/t
          fi
          cargo build --release --locked --target "$TARGET"
          if [ "$RUNNER_OS" = Windows ] && [ ! -e target ]; then
            powershell -NoProfile -Command "New-Item -ItemType Junction -Path target -Target C:/t | Out-Null"
          fi
      # The packaging scripts put this directory into every package.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: licenses
          path: dist/licenses
      - name: Install vpk
        shell: pwsh
        run: |
          dotnet tool install --global vpk --version $env:VPK_VERSION
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $tools = Join-Path $HOME '.dotnet/tools'
          $tools | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          # vpk is a framework-dependent net10.0 tool. Its launcher looks for the runtime
          # in DOTNET_ROOT, then in the system-wide default location; the macOS runners
          # keep .NET elsewhere and set no DOTNET_ROOT, so `dotnet` works and vpk does
          # not. Point DOTNET_ROOT at the install that owns the .NET 10 runtime.
          $runtime = dotnet --list-runtimes |
            Where-Object { $_ -match '^Microsoft\.NETCore\.App 10\.\S+ \[.+\]$' } |
            Select-Object -Last 1
          if (-not $runtime) {
            dotnet --list-runtimes
            Write-Output "::error::no .NET 10 runtime on this runner; vpk $env:VPK_VERSION needs one (add actions/setup-dotnet with dotnet-version 10.0.x)"
            exit 1
          }
          $shared = $runtime -replace '^.*\[(.+)\]$', '$1'
          $root = Split-Path (Split-Path $shared)
          Write-Output "DOTNET_ROOT=$root ($runtime)"
          "DOTNET_ROOT=$root" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # Prove that vpk starts, here and not in the middle of packaging.
          $env:DOTNET_ROOT = $root
          $env:PATH = $tools + [IO.Path]::PathSeparator + $env:PATH
          vpk --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::vpk is installed but does not start"
            exit 1
          }
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VPK_TOKEN: ${{ github.token }}
        run: ./scripts/package.ps1 -Version $env:VERSION -Target $env:TARGET -FetchPrevious
      - name: Package (macOS, Linux)
        if: runner.os != 'Windows'
        env:
          VPK_TOKEN: ${{ github.token }}
        run: scripts/package.sh --channel "$CHANNEL" --target "$TARGET" --version "$VERSION" --fetch-previous
      # Runs a copy of the packaged AppImage without FUSE. The window has to stay up
      # for 15 seconds (timeout exits with 124). Not blocking until proven reliable.
      - name: Smoke run of the AppImage under Xvfb (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          cp "releases/$CHANNEL/Acta-$CHANNEL.AppImage" "$RUNNER_TEMP/Acta.AppImage"
          chmod +x "$RUNNER_TEMP/Acta.AppImage"
          status=0
          xvfb-run -a timeout 15 "$RUNNER_TEMP/Acta.AppImage" --appimage-extract-and-run || status=$?
          echo "exit status: $status"
          if [ "$status" -ne 124 ]; then
            echo "::warning::the AppImage did not stay up for 15 seconds under Xvfb (exit status $status)"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acta-${{ matrix.channel }}
          path: releases/${{ matrix.channel }}/
          if-no-files-found: error
          # Installers and packages are already compressed.
          compression-level: 0
          retention-days: 14

  # Read-only half of what used to be one job: it only reads the build artifacts and
  # writes checksums, so it never holds a token that can write to the repository.
  collect:
    name: collect and checksum
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      # Handed to publish as a job output, not as a file: publish refuses a SHA256SUMS
      # artifact that is not the one written here.
      sums-sha256: ${{ steps.sums.outputs.sha256 }}
    env:
      CHANNELS: win-x64 osx-arm64 osx-x64 linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: acta-*
          path: artifacts
      - name: Write SHA256SUMS
        id: sums
        run: |
          mkdir extras
          cp install.sh install.ps1 extras/
          sums=$PWD/extras/SHA256SUMS
          : > "$sums"
          for channel in $CHANNELS; do
            dir=artifacts/acta-$channel
            if [ ! -f "$dir/assets.$channel.json" ]; then
              echo "::error::the $channel build produced no assets.$channel.json"
              exit 1
            fi
            jq -r '.[].RelativeFileName' "$dir/assets.$channel.json" | tr -d '\r' |
              while read -r file; do
                (cd "$dir" && sha256sum "$file") >> "$sums"
              done
            # vpk upload needs the build's feed, but it does not upload that file: it
            # writes releases.<channel>.json anew from this version's packages only
            # (the build's feed also lists the previous full package that pack
            # fetched). So the feeds are not hashed here; publish checks the feeds
            # GitHub serves against the packages and appends their hashes.
            if [ ! -f "$dir/releases.$channel.json" ]; then
              echo "::error::the $channel build produced no releases.$channel.json"
              exit 1
            fi
          done
          (cd extras && sha256sum install.sh install.ps1) >> "$sums"
          cat "$sums"
          duplicates=$(awk '{ print $2 }' "$sums" | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "::error::asset names collide between channels: $duplicates"
            exit 1
          fi
          for expected in Acta-win-x64-Setup.exe Acta-osx-arm64-Portable.zip Acta-osx-x64-Portable.zip Acta-linux-x64.AppImage; do
            if ! awk '{ print $2 }' "$sums" | grep -qxF "$expected"; then
              echo "::error::$expected is missing; install.sh and install.ps1 download it by that name"
              exit 1
            fi
          done
          echo "sha256=$(sha256sum "$sums" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      # SHA256SUMS and the two install scripts, exactly as they will be attached to the
      # release. The publish job takes them from here and checks out nothing.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-extras
          path: extras/
          if-no-files-found: error
          retention-days: 14

  # The only job whose token can write, and it runs only for a `v*` tag push. It checks
  # out no code: everything it runs is in this file, vpk and gh. The `release`
  # environment is restricted to `v*` tags in the repository settings
  # (docs/releasing.md), which keeps any other ref from reaching this job.
  # What the split protects is the token, not the bytes: this job publishes whatever
  # the build jobs produced and collect hashed, and trusts them for the content. Its
  # checks only establish that what it uploads is what collect saw.
  publish:
    name: publish release
    needs: [check, collect]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: v${{ needs.check.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
      SUMS_SHA256: ${{ needs.collect.outputs.sums-sha256 }}
      CHANNELS: win-x64 osx-arm64 osx-x64 linux-x64
      GH_TOKEN: ${{ github.token }}
      # gh has no checkout to read the repository from.
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: acta-*
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-extras
          path: extras
      - name: SHA256SUMS is the one the collect job wrote
        run: |
          actual=$(sha256sum extras/SHA256SUMS | cut -d ' ' -f 1)
          if [ -z "$SUMS_SHA256" ] || [ "$actual" != "$SUMS_SHA256" ]; then
            echo "::error::SHA256SUMS has digest $actual, the collect job reported '$SUMS_SHA256'"
            exit 1
          fi
      - name: Lay out one directory per channel and verify the checksums
        run: |
          mkdir releases
          dirs=extras
          for channel in $CHANNELS; do
            mv "artifacts/acta-$channel" "releases/$channel"
            dirs="$dirs releases/$channel"
          done
          # Every file SHA256SUMS lists must be here with the digest collect computed.
          # This catches an artifact that changed between the two jobs, nothing more.
          while read -r hash name; do
            found=
            for dir in $dirs; do
              if [ -f "$dir/$name" ]; then found=$dir/$name; break; fi
            done
            if [ -z "$found" ]; then
              echo "::error::$name is listed in SHA256SUMS but is not among the artifacts"
              exit 1
            fi
            actual=$(sha256sum "$found" | cut -d ' ' -f 1)
            if [ "$actual" != "$hash" ]; then
              echo "::error::checksum mismatch for $found"
              exit 1
            fi
          done < extras/SHA256SUMS
          echo "$(wc -l < extras/SHA256SUMS) files match SHA256SUMS"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: extras/SHA256SUMS
      - name: Install vpk
        shell: pwsh
        run: |
          dotnet tool install --global vpk --version $env:VPK_VERSION
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $tools = Join-Path $HOME '.dotnet/tools'
          $tools | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          # vpk is a framework-dependent net10.0 tool. Its launcher looks for the runtime
          # in DOTNET_ROOT, then in the system-wide default location; the macOS runners
          # keep .NET elsewhere and set no DOTNET_ROOT, so `dotnet` works and vpk does
          # not. Point DOTNET_ROOT at the install that owns the .NET 10 runtime.
          $runtime = dotnet --list-runtimes |
            Where-Object { $_ -match '^Microsoft\.NETCore\.App 10\.\S+ \[.+\]$' } |
            Select-Object -Last 1
          if (-not $runtime) {
            dotnet --list-runtimes
            Write-Output "::error::no .NET 10 runtime on this runner; vpk $env:VPK_VERSION needs one (add actions/setup-dotnet with dotnet-version 10.0.x)"
            exit 1
          }
          $shared = $runtime -replace '^.*\[(.+)\]$', '$1'
          $root = Split-Path (Split-Path $shared)
          Write-Output "DOTNET_ROOT=$root ($runtime)"
          "DOTNET_ROOT=$root" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # Prove that vpk starts, here and not in the middle of packaging.
          $env:DOTNET_ROOT = $root
          $env:PATH = $tools + [IO.Path]::PathSeparator + $env:PATH
          vpk --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::vpk is installed but does not start"
            exit 1
          }
      - name: Upload every channel to one draft release
        env:
          VPK_TOKEN: ${{ github.token }}
        run: |
          # A draft left by a failed earlier attempt would make vpk refuse to upload.
          # A published release with this tag is never touched.
          state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = true ]; then
            echo "Deleting the draft left by a previous attempt"
            gh release delete "$TAG" --yes
          elif [ "$state" = false ]; then
            echo "::error::release $TAG is already published; bump the version instead of re-releasing"
            exit 1
          fi

          # Create the draft here, on the tag that triggered this run, and let vpk
          # merge into it. Never send target_commitish: GitHub refuses to create
          # or edit a release whose target differs from the default branch under
          # .github/workflows unless the token may write workflows, which
          # GITHUB_TOKEN never may. Once main moves past the tag, a SHA target
          # fails with 403 (v0.1.1). With no target the default branch is used,
          # which never differs from itself, and the release still points at the
          # existing tag: target_commitish is ignored when the tag exists, and
          # --verify-tag aborts rather than create a tag on main.
          pre=
          if [ "$PRERELEASE" = true ]; then pre=--prerelease; fi
          gh release create "$TAG" --verify-tag --draft --title "Acta $VERSION" --notes "" $pre
          for channel in $CHANNELS; do
            vpk upload github --repoUrl "$REPO_URL" --channel "$channel" \
              --outputDir "releases/$channel" --merge --tag "$TAG" \
              --releaseName "Acta $VERSION"
          done
          # SHA256SUMS goes up last, once it also lists the feeds vpk wrote.
          gh release upload "$TAG" extras/install.sh extras/install.ps1
      - name: Check the draft and complete SHA256SUMS
        run: |
          fail() {
            echo "::error::$1; the release stays a draft"
            exit 1
          }
          # Names: what collect hashed plus one feed per channel, nothing else.
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.digest // "none") \(.name)"' | sort -k 2 > served.txt
          {
            awk '{ print $2 }' extras/SHA256SUMS
            for channel in $CHANNELS; do echo "releases.$channel.json"; done
          } | sort > expected.txt
          if ! awk '{ print $2 }' served.txt | diff expected.txt -; then
            fail "the draft does not hold exactly the expected assets (see the diff above)"
          fi
          # Bytes: GitHub's digest of every hashed asset is the one collect computed.
          while read -r hash name; do
            served=$(awk -v name="$name" '$2 == name { print $1 }' served.txt)
            if [ "$served" != "sha256:$hash" ]; then
              fail "$name is served with digest '$served', SHA256SUMS has $hash"
            fi
          done < extras/SHA256SUMS

          # Feeds: vpk writes them on upload, so check what is served. Each must list
          # exactly the full and delta packages of this version that the channel
          # built, with the size, SHA-1 and SHA-256 of the files verified above.
          gh release download "$TAG" --pattern 'releases.*.json' --dir feeds
          for channel in $CHANNELS; do
            feed=releases.$channel.json
            dir=releases/$channel
            served=$(awk -v name="$feed" '$2 == name { print $1 }' served.txt)
            actual=$(sha256sum "feeds/$feed" | cut -d ' ' -f 1)
            if [ "$served" != "sha256:$actual" ]; then
              fail "$feed downloaded with digest $actual, GitHub reports '$served'"
            fi
            # The feed format of vpk 1.2.161, nothing more: an unknown field could
            # change what a client does without failing any check below.
            if ! jq -e 'keys == ["Assets"] and (.Assets | type == "array" and length > 0)
                and all(.Assets[]; keys == ["FileName", "PackageId", "SHA1", "SHA256", "Size", "Type", "Version"])' \
                "feeds/$feed" > /dev/null; then
              fail "$feed is not a list of assets with exactly the known fields"
            fi
            # Type and name together: a full package listed as a delta must fail.
            jq -r '.[] | select(.Type == "Full" or .Type == "Delta") | "\(.Type) \(.RelativeFileName)"' \
              "$dir/assets.$channel.json" | tr -d '\r' | sort > packages.txt
            if ! jq -r '.Assets[] | "\(.Type) \(.FileName)"' "feeds/$feed" | sort | diff packages.txt -; then
              fail "$feed does not list exactly the packages the $channel build made, with their types"
            fi
            if [ "$(jq '[.Assets[] | select(.Type == "Full")] | length' "feeds/$feed")" != 1 ]; then
              fail "$feed does not list exactly one full package"
            fi
            jq -r '.Assets[] | [.PackageId, .Version, .Type, .FileName, .Size, .SHA1, .SHA256] | @tsv' \
              "feeds/$feed" > entries.tsv
            while IFS=$(printf '\t') read -r id version type file size sha1 sha256; do
              if [ "$id" != Acta ] || [ "$version" != "$VERSION" ]; then
                fail "$feed lists $file as $id $version, not Acta $VERSION"
              fi
              listed=$(awk -v name="$file" '$2 == name { print $1 }' extras/SHA256SUMS)
              if [ -z "$listed" ]; then
                fail "$feed lists $file, which is not in SHA256SUMS"
              fi
              want_sha1=$(sha1sum "$dir/$file" | cut -d ' ' -f 1)
              want_size=$(stat -c %s "$dir/$file")
              lower256=$(echo "$sha256" | tr 'A-F' 'a-f')
              lower1=$(echo "$sha1" | tr 'A-F' 'a-f')
              if [ "$lower256" != "$listed" ] || [ "$lower1" != "$want_sha1" ] || [ "$size" != "$want_size" ]; then
                fail "$feed records $file ($type) with size $size, SHA-1 $sha1, SHA-256 $sha256, which is not the file in SHA256SUMS"
              fi
            done < entries.tsv
            echo "ok: $feed lists $(wc -l < entries.tsv) packages of Acta $VERSION, all verified"
            (cd feeds && sha256sum "$feed") >> extras/SHA256SUMS
          done
          cat extras/SHA256SUMS
      - name: Attest the feeds
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: feeds/releases.*.json
      - name: Upload SHA256SUMS, then publish
        run: |
          gh release upload "$TAG" extras/SHA256SUMS
          served=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name == "SHA256SUMS") | .digest')
          if [ "$served" != "sha256:$(sha256sum extras/SHA256SUMS | cut -d ' ' -f 1)" ]; then
            echo "::error::SHA256SUMS is served with digest '$served', not the file just written; the release stays a draft"
            exit 1
          fi

          {
            echo "Install or update on Windows (PowerShell):"
            echo
            echo '```'
            echo "irm $REPO_URL/releases/latest/download/install.ps1 | iex"
            echo '```'
            echo
            echo "On macOS and Linux:"
            echo
            echo '```'
            echo "curl -fsSL $REPO_URL/releases/latest/download/install.sh | sh"
            echo '```'
            echo
            echo "An installed Acta updates itself at its next launch. Builds are unsigned: see $REPO_URL/blob/main/docs/install.md#unsigned-builds."
            echo
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body ||
              echo "::warning::could not generate the change list" >&2
          } > notes.md

          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --notes-file notes.md --draft=false --prerelease
          else
            gh release edit "$TAG" --notes-file notes.md --draft=false --latest
          fi
          echo "Published $REPO_URL/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
