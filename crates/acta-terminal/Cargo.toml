[package]
name = "acta-terminal"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
description = "Acta's embedded terminal: a PTY session on alacritty_terminal and its GPUI view (ADR 0002)."

[dependencies]
# The shared resolver for `claude` (ADR 0013, prereqs::locate).
acta-core.workspace = true
# Exact pins: ADR 0002 (no semver promise from alacritty_terminal) and ADR 0001 (UI stack).
alacritty_terminal = "=0.26.0"
async-channel = "2"
gpui-kit = "=0.10.0"
