[package]
name = "acta-app"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
description = "Acta desktop application (GUI executable, Velopack main exe)."
build = "build.rs"

[[bin]]
name = "Acta"
path = "src/main.rs"

[dependencies]
acta-core.workspace = true
acta-terminal = { path = "../acta-terminal" }
# Local UTC offset for the time forms of docs/design/copy.md 10.2.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Exact pins: ADR 0001 (UI stack) and ADR 0004 (must match the vpk tool version).
gpui-kit = "=0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# public-utils only makes modules public: `bundle::Manifest` is in the signature of
# `UpdateSource`, and `download` fetches the feed (update_source.rs).
velopack = { version = "=1.2.161", features = ["public-utils"] }
# Velopack's HTTP client, named only to match on `ureq::Error` (update.rs: the
# status or kind of a network error, for the log). Any 3.x unifies with velopack's
# own ureq dependency, which also brings its default features; the `rustls` feature is
# requested here because `Error::Rustls` exists only with it. If velopack moves to
# another major, the match no longer type-checks against `velopack::NetworkError`.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# The chat panel's navigation allow-list (chat.rs).
url = "2"
# Messages from the web view's handlers (which run outside GPUI) to the chat panel.
async-channel = "2"

# The chat panel (ADR 0009): the system web view, Windows and macOS only. Exact pins,
# bumped together with gpui-kit; gpui-webview builds on Longbridge's wry fork.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
gpui-webview = "=0.10.0"
wry = { version = "=0.53.3", package = "lb-wry" }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# The WebView2 controller events wry does not expose: accelerator keys routed to
# Acta, focus, and failed navigations (chat_windows.rs). Same versions as lb-wry's.
webview2-com = "=0.38.2"
windows = "0.61"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = "0.1.34"
