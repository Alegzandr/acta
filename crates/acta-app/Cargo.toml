[package]
name = "acta-app"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
description = "Acta desktop application (GUI executable, Velopack main exe)."
build = "build.rs"

[[bin]]
name = "Acta"
path = "src/main.rs"

[dependencies]
acta-core.workspace = true
# Exact pins: ADR 0001 (UI stack) and ADR 0004 (must match the vpk tool version).
gpui-kit = "=0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# public-utils only makes modules public: `bundle::Manifest` is in the signature of
# `UpdateSource`, and `download` fetches the feed (update_source.rs).
velopack = { version = "=1.2.161", features = ["public-utils"] }
# Velopack's HTTP client, named only to read the status or the kind of a network
# error for the log. Same major and features as velopack 1.2.161 uses, so cargo
# keeps one copy; a velopack that moves to another ureq fails to compile here.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = "0.1.34"
