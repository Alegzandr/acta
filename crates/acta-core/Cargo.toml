[package]
name = "acta-core"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
description = "Acta domain layer: no GPUI, no Velopack. Shared by the app, the CLI and the MCP server."

# Storage engine and key handling: ADR 0003. SQLCipher on vendored OpenSSL off
# macOS (needs Perl at build time), on CommonCrypto on macOS.
[target.'cfg(not(target_os = "macos"))'.dependencies]
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled-sqlcipher-vendored-openssl", "backup"] }

[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled-sqlcipher", "backup"] }

# Folder identity and handle-free presence checks (folder_identity.rs); the
# job object that ends a timed-out process tree (process.rs); the registry
# PATH (prereqs/locate.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

# SIGPIPE ignored in an installer, so Acta quitting never kills it
# through its closed output pipe (prereqs/install.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
# The local time zone for "today" and local days (date.rs, Zone::system).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.4"
hmac = "0.12"
keyring = "4.2.0"
schemars = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order: the settings writer keeps the user's key order.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
uuid = { version = "1", default-features = false, features = ["std", "v7"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
