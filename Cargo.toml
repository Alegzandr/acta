[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2024"
repository = "https://github.com/Alegzandr/acta"
license = "MIT"
publish = false

[workspace.dependencies]
acta-core = { path = "crates/acta-core" }

# Thin LTO and stripped symbols (ADR 0001 measured this profile). Everything
# else is the release default.
[profile.release]
lto = "thin"
strip = true
# panic stays "unwind" (the default) on purpose: export and update work runs on
# background threads, and a panic there must end that thread, not the app.

# scrypt (a backup's passphrase, ADR 0006) is optimised in debug builds too:
# unoptimised, one backup's key derivation takes tens of seconds.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
