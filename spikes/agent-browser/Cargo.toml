[package]
name = "acta-spike-agent-browser"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone throwaway spike for ADR 0010; deliberately not a workspace member.
[workspace]

[dependencies]
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"
url = "2"

[target.'cfg(windows)'.dependencies]
# Same pins as the app (ADR 0009): Longbridge's wry fork and the matching webview2-com.
wry = { version = "=0.53.3", package = "lb-wry" }
webview2-com = "=0.38.2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
