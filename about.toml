# cargo-about configuration: the licences a dependency of Acta may have.
# scripts/licenses.sh fails, and with it CI and the release, when a crate in the
# dependency tree carries a licence that is not listed here. Adding one is a decision:
# everything below allows shipping a closed or open binary with the notice texts next
# to it, which is what the packages do (the `licenses` directory). MPL-2.0 is file-level
# copyleft; the crates under it are used unmodified from crates.io.
# All targets are considered (no `targets` list), so one file covers every channel.
# The workspace's own crates are not third-party.
private = { ignore = true }
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    # SQLCipher's crate (ADR 0003): the SQLite blessing (public domain) and the
    # WTFPL of the bundled libtomcrypt. Both put no condition on the binary.
    "blessing",
    "WTFPL",
]
